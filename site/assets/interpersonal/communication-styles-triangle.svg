<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Four communication styles</title>
  <desc id="desc">A triangle places assertive communication at the top, passive communication at the lower left, aggressive communication at the lower right, and passive-aggressive communication centered along the bottom edge.</desc>
  <defs>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f5f3"/>
      <stop offset="0.5" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#fff0e8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="#fff"/>
  <polygon points="600,210 255,690 945,690" fill="url(#tri)" stroke="#4b84a6" stroke-width="8"/>
  <circle cx="600" cy="210" r="16" fill="#177e73"/>
  <circle cx="255" cy="690" r="16" fill="#4d8fbd"/>
  <circle cx="945" cy="690" r="16" fill="#d85a32"/>
  <circle cx="600" cy="690" r="16" fill="#7d6ba6"/>

  <text x="600" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#156e68">Assertive</text>
  <text x="600" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#244b6d">Clear • Respectful • Confident</text>

  <text x="170" y="782" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#245f8b">Passive</text>
  <text x="170" y="820" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#244b6d">Avoids • Withholds • Self-sacrifices</text>

  <text x="1030" y="782" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#bd4426">Aggressive</text>
  <text x="1030" y="820" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#244b6d">Pushes • Disrespects • Dominates</text>

  <text x="600" y="742" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#554a73">Passive-aggressive</text>
  <text x="600" y="780" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#244b6d">Indirect • Conflicted • Unclear</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Anxiety and avoidance cycle</title>
  <desc id="desc">A clockwise cycle showing anxiety leading to avoidance behaviour, then short-term relief, then anxiety being reinforced, which leads back to anxiety.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d49a2f"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324d" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="820" fill="#fbfaf6"/>

  <g fill="none" stroke="#d49a2f" stroke-width="11" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M780 145 C900 165 982 225 1005 315"/>
    <path d="M1012 500 C990 610 910 675 792 700"/>
    <path d="M420 700 C295 682 208 620 183 514"/>
    <path d="M186 315 C215 220 300 160 421 142"/>
  </g>

  <circle cx="600" cy="415" r="145" fill="#edf3f0" stroke="#dfe8e2" stroke-width="2"/>
  <text x="600" y="398" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#17365f">Anxiety</text>
  <text x="600" y="458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" fill="#17365f">cycle</text>

  <g filter="url(#shadow)">
    <rect x="430" y="45" width="340" height="190" rx="42" fill="#315879"/>
    <rect x="850" y="305" width="300" height="215" rx="42" fill="#8bc6c5"/>
    <rect x="430" y="620" width="340" height="165" rx="42" fill="#b8d7ef"/>
    <rect x="50" y="305" width="300" height="215" rx="42" fill="#b7cfa7"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <text x="600" y="154" font-size="52" fill="#ffffff">Anxiety</text>

    <text x="1000" y="393" font-size="42" fill="#17365f">Avoidance</text>
    <text x="1000" y="445" font-size="42" fill="#17365f">behaviour</text>

    <text x="600" y="690" font-size="42" fill="#17365f">Short-term</text>
    <text x="600" y="741" font-size="42" fill="#17365f">relief</text>

    <text x="200" y="392" font-size="42" fill="#17365f">Anxiety</text>
    <text x="200" y="444" font-size="42" fill="#17365f">reinforced</text>
  </g>

  <g fill="none" stroke="#17365f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M560 105 c-18 8-29 23-29 42 0 18 10 31 24 39 v18"/>
    <path d="M589 111 c-14 0-25 10-25 23 0 5 2 10 5 14 5-7 14-11 23-11 15 0 27 11 27 26 0 13-10 24-23 26"/>
    <path d="M958 355 c-10 17-14 37-13 58 l-15 34"/>
    <path d="M952 412 l31 28 27 1"/>
    <path d="M946 435 l-12 35"/>
    <circle cx="967" cy="337" r="10"/>
    <circle cx="600" cy="660" r="26"/>
    <path d="M588 659 q12 12 24 0"/>
    <path d="M576 673 q24 18 48 0"/>
    <path d="M168 370 a43 43 0 1 0 55-3"/>
    <path d="M219 350 l7 23-24-2"/>
  </g>

  <g stroke="#d49a2f" stroke-width="7" stroke-linecap="round">
    <path d="M600 84 v-18"/>
    <path d="M575 88 l-10-17"/>
    <path d="M625 88 l10-17"/>
    <path d="M568 655 h-15"/>
    <path d="M632 655 h15"/>
    <path d="M242 384 h18"/>
    <path d="M244 401 l16 8"/>
  </g>
</svg>

project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "!analyze/"
    - "!engine-benchmark/"
    - "!match-predictor/"
    - "!posts/"
    - "!research/"
    - "!updates/"
  pre-render:
  - python ../scripts/bs_pre_render.py
  - python ../scripts/page_publication.py validate-source
  post-render:
  - python ../scripts/bs_post_render.py
  - python ../scripts/page_publication.py apply
  - python ../scripts/site_base_paths.py
  resources:
    - assets/logo.svg
    - "assets/icons/**"
    - "assets/social/generated/*.png"
    - assets/bs-glossary.js
    - assets/bs-learn.js
    - assets/site-path.js
    - assets/d3-values-force.min.js
    - assets/therapy-force-graph.js
    - assets/therapy-calendar.js
    - assets/skill-apps.js
    - assets/skill-progress.js
    - assets/resource-paraphrases.js
    - assets/resource-review-app.js
    - assets/resource-review-app.css
    - assets/resource-paraphrases.css
    - "assets/paraphrased-resources/**"
    - assets/skill-handoff.js
    - assets/skill-finder-apps.js
    - assets/skill-practice-apps.js
    - assets/skill-quick-tools.js
    - assets/tool-finder.js
    - assets/therapy-audio.js
    - "data/tool-finder/**"
    - "data/audio/**"
    - "resources/audio/**"
    - "resources/mindfulness/**"
    - "resources/wellness/urge-surfing/**"
    - "resources/wellness/stages-of-change/**"
    - "data/skill-apps/**"
    - "data/resource-paraphrases/**"
    - assets/bs-glossary-lookup.json
    - assets/bs-learn-scroll.js
    - assets/bs-learn-sequence.json
    - assets/bs-cbt-sequence.json
    - assets/bs-mindfulness-sequence.json
    - assets/bs-research-sequence.json

filters:
  - bs-link-policy

metadata-files:
  - _publication.yml
  - _learn-navigation.yml

website:
  title: "Free Therapy Tools"
  description: "A practical curriculum of DBT, CBT, and mindfulness skills."
  search:
    location: navbar
    type: overlay
  favicon: assets/icons/favicon.ico
  image: assets/social/generated/social-default.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  navbar:
    logo: assets/logo.svg
    logo-alt: "Free Therapy Tools"
    collapse-below: xl
    left:
      - text: Tool Finder
        href: tool-finder/index.qmd
      - text: DBT Skills
        href: learn/index.qmd
      - text: CBT Skills
        href: cbt-skills/index.qmd
      - text: Mindfulness
        href: mindfulness/index.qmd
    right:
      - href: glossary/index.qmd
        text: Glossary
      - href: about.qmd
        text: About
  page-footer:
    left: |
      Free Therapy Tools · Under active development
    center:
      - text: "Code: AGPL-3.0-only \u00b7 Educational content: CC BY-SA 4.0 \u00b7 Licensing"
        href: licensing.qmd

format:
  html:
    theme: [cosmo, assets/bs-theme.scss]
    css:
      - assets/bs-shared.css
      - assets/bs-components.css
      - assets/bs-learn.css
      - assets/bs-lesson-analysis.css
      - assets/skill-apps.css
      - assets/skill-progress.css
      - assets/resource-paraphrases.css
    include-after-body:
      - includes/bs-scripts.html
    include-in-header:
      - includes/site-head.html
    toc: true
    toc-location: right
    toc-depth: 3
    toc-title: "On this page"
    smooth-scroll: true
    link-external-newwindow: false
    code-copy: true

execute:
  freeze: auto

editor: source

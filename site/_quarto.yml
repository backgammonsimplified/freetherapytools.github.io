project:
  type: website
  output-dir: _site
  pre-render:
  - python ../scripts/bs_pre_render.py
  - python ../scripts/page_publication.py validate-source
  post-render:
  - python ../scripts/bs_post_render.py
  - python ../scripts/page_publication.py apply
  resources:
    - assets/logo.svg
    - "assets/icons/**"
    - "assets/social/generated/*.png"
    - assets/bs-glossary.js
    - assets/bs-learn.js
    - assets/skill-apps.js
    - assets/skill-progress.js
    - assets/skill-handoff.js
    - assets/skill-finder-apps.js
    - assets/skill-practice-apps.js
    - "data/skill-apps/**"
    - assets/bs-glossary-lookup.json
    - assets/bs-learn-scroll.js
    - assets/bs-learn-sequence.json
    - assets/bs-cbt-sequence.json
    - assets/bs-mindfulness-sequence.json
    - assets/bs-research-sequence.json
    - "assets/positions/**"
    - data/lesson-analysis-svg-mvp.json
    - data/checker-sage-gnu-disagreement-001.json
    - "data/engine-benchmark/**"
    - "engine-benchmark/**/figures/**"
    - "engine-benchmark/**/tables/**"
    - "engine-benchmark/**/data/**"
    - "engine-benchmark/**/captions.yml"
    - "engine-benchmark/**/PUBLICATION_MANIFEST.yml"
    - "engine-benchmark/**/checksums.sha256"

filters:
  - bs-link-policy

metadata-files:
  - _publication.yml
  - _learn-navigation.yml

website:
  title: "Therapy Skill Kit"
  description: "A practical curriculum of DBT, CBT, and mindfulness skills."
  search:
    location: navbar
    type: overlay
  favicon: assets/icons/favicon.ico
  image: /assets/social/generated/social-default.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  navbar:
    logo: assets/logo.svg
    logo-alt: "Therapy Skill Kit"
    collapse-below: xl
    left:
      - text: Skill Finder
        href: skill-finder/index.qmd
      - text: DBT Skills
        href: learn/index.qmd
      - text: CBT Skills
        href: cbt-skills/index.qmd
      - text: Mindfulness
        href: mindfulness/index.qmd
    right:
      - href: glossary/index.qmd
        text: Glossary
      - href: about.qmd
        text: About
  page-footer:
    left: |
      Therapy Skill Kit
    center:
      - text: "Code: AGPL-3.0-only \u00b7 Educational content: CC BY-SA 4.0 \u00b7 Licensing"
        href: /licensing.html

format:
  html:
    theme: [cosmo, assets/bs-theme.scss]
    css:
      - assets/bs-shared.css
      - assets/bs-components.css
      - assets/bs-learn.css
      - assets/bs-lesson-analysis.css
      - assets/skill-apps.css
      - assets/skill-progress.css
    include-after-body:
      - includes/bs-scripts.html
    include-in-header:
      - includes/site-head.html
    toc: true
    toc-location: right
    toc-depth: 3
    toc-title: "On this page"
    smooth-scroll: true
    link-external-newwindow: false
    code-copy: true

execute:
  freeze: auto

editor: source

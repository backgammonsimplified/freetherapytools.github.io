website:
  title: "Free Therapy Tools"
  site-url: "https://backgammonsimplified.github.io/freetherapytools.github.io"

bs-publication:
  schema-id: "https://backgammonsimplified.github.io/freetherapytools.github.io/schemas/publication-identity-v1"
  name: "Free Therapy Tools"
  acronym: "FTT"
  canonical-origin: "https://backgammonsimplified.github.io/freetherapytools.github.io"
  authored-content:
    author:
      schema-type: Person
      name: "Marty Gale"
      url: "https://backgammonsimplified.github.io/freetherapytools.github.io/about.html"
    publisher:
      schema-type: Organization
      name: "Free Therapy Tools"
      url: "https://backgammonsimplified.github.io/freetherapytools.github.io/"
    modified-date-field: date-modified
  indexing:
    environment-variable: "BS_PUBLICATION_MODE"
    default-mode: development
    modes:
      development:
        robots-meta: "noindex, follow"
        robots-txt:
          - "User-agent: *"
          - "Allow: /"
      production:
        robots-meta: "index, follow, max-image-preview:large"
        robots-txt:
          - "User-agent: *"
          - "Allow: /"
          - "Sitemap: https://backgammonsimplified.github.io/freetherapytools.github.io/sitemap.xml"
  pages:
    default:
      type: page
      status: draft
    types:
      page:
        schema-type: WebPage
        updates-feed: false
      learn-index:
        schema-type: CollectionPage
        updates-feed: false
      learn-lesson:
        schema-type: Article
        updates-feed: true
        social-card:
          kind: article
          category: Learn
    statuses:
      published:
        indexable: true
        sitemap: true
        rss: true
      preliminary:
        indexable: false
        sitemap: false
        rss: false
      draft:
        indexable: false
        sitemap: false
        rss: false
      fixture:
        indexable: false
        sitemap: false
        rss: false
      error:
        indexable: false
        sitemap: false
        rss: false
      legacy:
        indexable: false
        sitemap: false
        rss: false
    routes:
      /:
        source: site/index.qmd
        type: page
        status: published
      /about.html:
        source: site/about.qmd
        type: page
        status: published
      /glossary/:
        source: site/glossary/index.qmd
        type: page
        status: published
      /licensing.html:
        source: site/licensing.qmd
        type: page
        status: published
      /learn/index.html:
        source: site/learn/index.qmd
        type: learn-index
        status: published
        parents:
          - label: Home
            route: /
  research:
    categories:
      - DBT Skills
      - CBT Skills
      - Mindfulness
      - Wellness

name: Deploy development preview to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Run deployment contracts
        run: |
          python -m unittest tests.test_pages_deployment
          node tests/test_site_path.js

      - name: Render site
        env:
          BS_SKIP_SOCIAL_CARDS: "1"
        run: |
          unset TSK_RESOURCE_REVIEW
          quarto render site

      - name: Verify rendered homepage
        run: |
          if [ ! -f site/_site/index.html ]; then
            echo "::error file=site/_site/index.html::Quarto did not produce the Pages homepage."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
